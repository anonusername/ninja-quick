name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run --auto-servernum npm test
        env:
          # A fresh CI checkout's chrome-sandbox binary isn't root-owned/4755, which Electron's
          # SUID sandbox requires — it aborts rather than run unsandboxed by default. Safe to
          # disable here: test-integration.js never opens a BrowserWindow, so there's no untrusted
          # renderer content for the OS sandbox to actually be protecting.
          ELECTRON_DISABLE_SANDBOX: '1'

  build:
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx electron-builder --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
