<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ninja-quick — Web Requests</title>
  <style>
    :root {
      --bg: #12100c;
      --bg-alt: #1a1712;
      --bg-row: #17140f;
      --bg-hover: #221d15;
      --border: #332b1f;
      --text: #e8e0d0;
      --muted: #9a8f79;
      --gold: #e0b25a;
      --green: #7bc86c;
      --blue: #6ab0d8;
      --red: #e06a5a;
      --mono: ui-monospace, "Cascadia Code", "Consolas", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .toolbar .title { color: var(--gold); font-weight: 600; letter-spacing: 0.3px; }
    .toolbar .count { color: var(--muted); }
    .toolbar .spacer { flex: 1; }
    .toolbar input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      width: 200px;
    }
    .toolbar input[type="text"]:focus { outline: 1px solid var(--gold); border-color: var(--gold); }
    .toolbar label { color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .toolbar button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .toolbar button:hover { background: var(--bg-hover); border-color: var(--gold); }

    .table-wrap { flex: 1; overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      position: sticky;
      top: 0;
      background: var(--bg-alt);
      color: var(--muted);
      text-align: left;
      font-weight: 500;
      padding: 5px 8px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      z-index: 1;
    }
    tbody td {
      padding: 3px 8px;
      border-bottom: 1px solid var(--bg-row);
      white-space: nowrap;
      vertical-align: top;
    }
    tbody tr:hover { background: var(--bg-hover); }
    td.url { white-space: normal; word-break: break-all; color: var(--text); }
    td.host { color: var(--muted); }
    td.num { text-align: right; color: var(--muted); }
    .method { color: var(--gold); }
    .status-pending { color: var(--muted); }
    .status-2 { color: var(--green); }
    .status-3 { color: var(--blue); }
    .status-4, .status-5, .status-err { color: var(--red); }
    tr.hidden { display: none; }

    .empty {
      color: var(--muted);
      padding: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="title">Web Requests</span>
    <span class="count" id="count">0 requests</span>
    <span class="spacer"></span>
    <input type="text" id="filter" placeholder="filter by url / method / status" autocomplete="off" spellcheck="false" />
    <label><input type="checkbox" id="autoscroll" checked /> Auto-scroll</label>
    <button id="clear">Clear</button>
  </div>
  <div class="table-wrap" id="wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Time</th>
          <th>Method</th>
          <th>Status</th>
          <th>Type</th>
          <th>Duration</th>
          <th>Size</th>
          <th>Host</th>
          <th>URL</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">Waiting for requests… (this window captures every request the app makes while it's open)</div>
  </div>
  <script src="debug.js"></script>
</body>
</html>
