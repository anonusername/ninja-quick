<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ninja-quick</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ════════ Game Switcher — the most visible element ════════ -->
  <div class="game-switcher">
    <button id="btn-poe1" class="game-tab" data-game="poe1">POE 1</button>
    <div class="tab-divider"></div>
    <button id="btn-poe2" class="game-tab active" data-game="poe2">POE 2</button>
  </div>

  <!-- Active game label — always visible, zero ambiguity -->
  <div class="active-label">
    <span id="active-game-text">Current: POE 2</span>
    <select id="league-select" class="league-select"></select>
    <select id="unit-select" class="unit-select" title="Display currency">
      <option value="Auto">Auto</option>
      <option value="Chaos">Chaos</option>
      <option value="Divine">Divine</option>
      <option value="Exalted">Exalted</option>
    </select>
  </div>

  <!-- ════════ Search Field ════════ -->
  <div class="search-container">
    <input
      type="text"
      id="search-input"
      placeholder="Search items, currency, uniques…"
      autocomplete="off"
      spellcheck="false"
    />
    <button id="btn-refresh" class="refresh-btn" title="Refresh data">⟳</button>
    <button id="btn-settings" class="refresh-btn" title="Settings">⚙</button>
  </div>

  <!-- ════════ Status Bar ════════ -->
  <div class="status-bar">
    <span id="data-status">No data loaded</span>
    <span id="next-refresh" class="next-refresh"></span>
  </div>

  <!-- ════════ Main Area: category sidebar + results ════════ -->
  <div class="main-area">
    <!-- Live-scraped category nav (mirrors poe.ninja's own economy-page sidebar) -->
    <div id="category-sidebar" class="category-sidebar">
      <!-- Dynamically populated by renderer.js -->
    </div>

    <div id="results-container" class="results-container">
      <!-- Dynamically populated by renderer.js -->
      <div class="empty-state" id="empty-state">
        <p>Type something to search</p>
      </div>
    </div>
  </div>

  <script type="module" src="vendor/fuse-global.mjs"></script>
  <script src="renderer.js"></script>
</body>
</html>
