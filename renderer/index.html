<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ninja-quick</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ════════ Game Switcher — the most visible element ════════ -->
  <div class="game-switcher">
    <button id="btn-poe1" class="game-tab" data-game="poe1">POE 1</button>
    <div class="tab-divider"></div>
    <button id="btn-poe2" class="game-tab active" data-game="poe2">POE 2</button>
  </div>

  <!-- Active game label — always visible, zero ambiguity -->
  <div class="active-label">
    <span id="active-game-text">Current: POE 2</span>
    <select id="league-select" class="league-select"></select>
    <select id="unit-select" class="unit-select" title="Display currency" aria-label="Display currency unit">
      <option value="Auto">Auto</option>
      <option value="Chaos">Chaos</option>
      <option value="Divine">Divine</option>
      <option value="Exalted">Exalted</option>
    </select>
  </div>

  <!-- ════════ Search Field ════════ -->
  <div class="search-container">
    <!-- Wrapper anchors the dynamically-created clear button + search-history dropdown
         (renderer.js) relative to the input, without disturbing the flex layout of the
         refresh/settings buttons beside it. -->
    <div class="search-input-wrap">
      <input
        type="text"
        id="search-input"
        placeholder="Search items, currency, uniques…"
        autocomplete="off"
        spellcheck="false"
        aria-label="Search items and currency"
      />
    </div>
    <button id="btn-refresh" class="refresh-btn" title="Refresh data" aria-label="Refresh data">⟳</button>
    <button id="btn-settings" class="refresh-btn" title="Settings" aria-label="Open settings">⚙</button>
  </div>

  <!-- Error banner (hidden by default, shown on fetch failure) -->
  <div id="error-banner" class="error-banner" style="display:none" role="alert" aria-live="assertive">
    <span id="error-message"></span>
    <button id="error-dismiss" aria-label="Dismiss error">✕</button>
  </div>

  <!-- ════════ Status Bar ════════ -->
  <div class="status-bar" role="status" aria-live="polite">
    <span id="data-status">No data loaded</span>
    <span id="next-refresh" class="next-refresh"></span>
  </div>

  <!-- ════════ Exchange-rate ticker (the number traders watch — Divine⇄base) ════════ -->
  <div id="rate-ticker" class="rate-ticker" style="display:none"></div>

  <!-- ════════ Main Area: category sidebar + results ════════ -->
  <div class="main-area">
    <!-- Live-scraped category nav (mirrors poe.ninja's own economy-page sidebar) -->
    <nav id="category-sidebar" class="category-sidebar" aria-label="Categories">
      <!-- Dynamically populated by renderer.js -->
    </nav>

    <div id="results-container" class="results-container" role="list" aria-label="Search results">
      <!-- Dynamically populated by renderer.js -->
      <div class="empty-state" id="empty-state">
        <p>Type something to search</p>
      </div>
    </div>
  </div>

  <script type="module" src="vendor/fuse-global.mjs"></script>
  <script src="renderer.js"></script>
</body>
</html>
